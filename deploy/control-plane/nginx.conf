events {}

http {
    ssl_certificate     /tls/server.pem;
    ssl_certificate_key /tls/server.key;

    server {
        listen 9443 ssl;
        location / {
            proxy_pass http://northbound:9080;
        }
    }

    server {
        listen 8443 ssl;
        location / {
            proxy_pass http://southbound:8081;
        }
    }
}
