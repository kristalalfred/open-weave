[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/cli",
    "crates/northbound",
    "crates/southbound",
    "crates/controller",
    "crates/adapter-strom",
    "crates/strom",
    "crates/bench",
    "crates/media",
    "crates/spaghetti",
    "crates/adapter-spaghetti",
]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
repository = "https://github.com/KristalAlfred/open-weave"

[workspace.dependencies]
weave-core = { path = "crates/core" }
weave-strom = { path = "crates/strom" }
weave-spaghetti = { path = "crates/spaghetti" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
schemars = "0.9"
serde_norway = "0.9"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
percent-encoding = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
srt-tokio = "0.4.4"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
