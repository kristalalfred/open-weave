name: deleted-flow
description: A deleted sender flow is recreated and decodes again without interrupting another stream.
steps:
  - do: apply
    stream: main
    file: ../manifests/basic.yaml
  - do: drive
    stream: main
  - do: apply
    stream: other
    file: ../manifests/reverse.yaml
  - do: drive
    stream: other
  - do: await
    stream: main
    status: flowing
  - do: await
    stream: other
    status: flowing
  - do: snapshot
    stream: other
    as_name: isolated
  - do: observe
    receivers: [other/output]
    seconds: 20
    during:
      - do: runtime
        stream: main
        node: 1
        action: delete
      - do: flows
        stream: main
        nodes: {strom-node-1: 1, strom-node-2: 1}
        timeout_secs: 45
      - do: await
        stream: main
        status: flowing
        timeout_secs: 45
  - do: unchanged
    snapshot: isolated
  - do: observe
    receivers: [main/output, other/output]
    seconds: 10
  - do: delete
    stream: main
  - do: delete
    stream: other
