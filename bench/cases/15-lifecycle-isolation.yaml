name: lifecycle-isolation
description: Disabling, enabling, deleting and recreating one stream leaves another feed and its flows unchanged.
steps:
  - do: apply
    stream: main
    file: ../manifests/basic.yaml
  - do: drive
    stream: main
  - do: apply
    stream: main-backup
    file: ../manifests/reverse.yaml
  - do: drive
    stream: main-backup
  - do: await
    stream: main
    status: flowing
  - do: await
    stream: main-backup
    status: flowing
  - do: snapshot
    stream: main-backup
    as_name: isolated
  - do: observe
    receivers: [main-backup/output]
    seconds: 20
    during:
      - do: undrive
        stream: main
      - do: apply
        stream: main
        file: ../manifests/disabled.yaml
      - do: await
        stream: main
        status: idle
      - do: flows
        stream: main
        nodes: {}
      - do: apply
        stream: main
        file: ../manifests/basic.yaml
      - do: drive
        stream: main
      - do: await
        stream: main
        status: flowing
  - do: observe
    receivers: [main-backup/output]
    seconds: 20
    during:
      - do: undrive
        stream: main
      - do: apply
        stream: main
        file: ../manifests/fanout.yaml
      - do: drive
        stream: main
      - do: await
        stream: main
        status: flowing
      - do: flows
        stream: main
        nodes: {strom-node-1: 2, strom-node-2: 1}
      - do: undrive
        stream: main
      - do: apply
        stream: main
        file: ../manifests/basic.yaml
      - do: drive
        stream: main
      - do: await
        stream: main
        status: flowing
      - do: flows
        stream: main
        nodes: {strom-node-1: 1, strom-node-2: 1}
  - do: observe
    receivers: [main-backup/output]
    seconds: 20
    during:
      - do: delete
        stream: main
      - do: apply
        stream: main
        file: ../manifests/basic.yaml
      - do: drive
        stream: main
      - do: await
        stream: main
        status: flowing
  - do: unchanged
    snapshot: isolated
  - do: delete
    stream: main
  - do: delete
    stream: main-backup
